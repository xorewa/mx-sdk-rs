[package]
name = "drwa-auth-admin"
version = "0.0.0"
edition = "2024"
publish = false
authors = ["Dharitri <dev@dharitri.org>"]

[lib]
path = "src/lib.rs"

[features]
# Produces a distinct, disposable local-devnet artifact with accelerated
# governance delays. Never enable this for public Devnet, Testnet, or Mainnet.
local-test-timelock = []

[dependencies.multiversx-sc]
workspace = true

[dependencies.drwa-common]
path = "../common"

[dev-dependencies.multiversx-sc-scenario]
workspace = true
features = ["wasmer-experimental"]

[dev-dependencies.multisig]
path = "../../examples/multisig"
