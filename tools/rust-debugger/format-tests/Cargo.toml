[package]
name = "format-tests"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "format-tests"
path = "src/format_tests.rs"

[dependencies.multiversx-sc]
version = "=0.66.2"
path = "../../../framework/base"

[dependencies.multiversx-sc-scenario]
version = "=0.66.2"
path = "../../../framework/scenario"

[dependencies.multiversx-chain-vm]
version = "=0.23.1"
path = "../../../chain/vm"

[dependencies]
hex = "0.4"

[dev-dependencies]
glob = "0.3"

[workspace]
members = ["."]

# This standalone CI workspace does not inherit the repository root patch.
# Keep its VM ABI aligned with the Xorewa chain/vm implementation.
[patch.crates-io]
multiversx-chain-vm-executor = { git = "https://github.com/xorewa/mx-vm-executor-rs", rev = "830f3efa2a1c8103424e4dd0c65b786e1f8305cf" }

