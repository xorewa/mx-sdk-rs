[package]
name = "gas_tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/gas_tests.rs"

[dependencies.multiversx-sc]
version = "0.66.2"
path = "../../../framework/base"

[dev-dependencies.multiversx-sc-scenario]
version = "0.66.2"
path = "../../../framework/scenario"

[dependencies.multiversx-chain-vm-wasmer-prod]
path = "../../../chain/wasmer-prod"
optional = true

[features]
wasmer-prod = ["multiversx-chain-vm-wasmer-prod"]
wasmer-experimental = ["multiversx-sc-scenario/wasmer-experimental"]

[patch.crates-io]
multiversx-chain-vm-executor = { git = "https://github.com/xorewa/mx-vm-executor-rs", rev = "830f3efa2a1c8103424e4dd0c65b786e1f8305cf" }
multiversx-chain-vm-executor-wasmer-experimental = { git = "https://github.com/xorewa/mx-vm-executor-rs", rev = "830f3efa2a1c8103424e4dd0c65b786e1f8305cf" }

[workspace]
members = ["."]
